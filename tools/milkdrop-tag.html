<!doctype html>
<meta charset="utf-8">
<title>MilkDrop preset tagger</title>
<!-- Run through tools/milkdrop-tag.js, not by hand. Renders every preset in
     the pinned butterchurn-presets packs at low resolution against the same
     kind of generated beat the app uses for streamed songs, measures what it
     actually looks like (brightness, colour, motion), and posts the numbers
     back to the script, which turns them into visuals/milkdrop-tags.json.
     Versions here must match MILK_LIB in index.html. -->
<canvas id="c" width="128" height="96"></canvas>
<pre id="log"></pre>
<script src="https://cdn.jsdelivr.net/npm/butterchurn@2.6.7/lib/butterchurn.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/butterchurn-presets@2.4.7/lib/butterchurnPresets.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/butterchurn-presets@2.4.7/lib/butterchurnPresetsExtra.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/butterchurn-presets@2.4.7/lib/butterchurnPresetsExtra2.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/butterchurn-presets@2.4.7/lib/butterchurnPresetsMD1.min.js"></script>
<script>
(async () => {
  const log = (s) => { document.getElementById('log').textContent += s + '\n'; };
  const W = 128, H = 96, FPS = 30, WARM = 45, FRAMES = 165, STEP = 4;
  // Same pack order as MILK_PACKS in index.html; a name in two packs keeps the first.
  const packs = ['butterchurnPresets', 'butterchurnPresetsExtra', 'butterchurnPresetsExtra2', 'butterchurnPresetsMD1'].map(g => {
    const m = window[g];
    if (!m) throw new Error(g + ' did not load');
    return typeof m.getPresets === 'function' ? m.getPresets() : (m.default || m);
  });
  const canvas = document.getElementById('c');
  const actx = new AudioContext();
  const bc = window.butterchurn.default || window.butterchurn;
  const viz = bc.createVisualizer(actx, canvas, { width: W, height: H, pixelRatio: 1, textureRatio: 1 });
  const gl = canvas.getContext('webgl2');
  const px = new Uint8Array(W * H * 4);

  // 120 bpm four-on-the-floor: kick, offbeat hat, backbeat snare.
  const td = new Uint8Array(1024);
  function frame(t){
    const beat = t * 2, ph = beat % 1, bar = beat % 4;
    const kick = Math.exp(-ph * 9), hat = Math.exp(-Math.abs(ph - 0.5) * 30) * 0.5;
    const snare = (bar >= 1 && bar < 2 || bar >= 3) ? Math.exp(-ph * 14) * 0.6 : 0;
    for (let i = 0; i < 1024; i++){
      const s = i / 44100;
      let v = kick * Math.sin(2 * Math.PI * (48 + 60 * kick) * (t + s)) * 0.9
            + 0.18 * Math.sin(2 * Math.PI * 220 * (t + s)) * (0.6 + 0.4 * Math.sin(t * 0.7))
            + (Math.random() * 2 - 1) * (snare * 0.5 + hat * 0.35);
      td[i] = Math.max(0, Math.min(255, 128 + v * 110));
    }
    return { timeByteArray: td, timeByteArrayL: td, timeByteArrayR: td };
  }

  const seen = new Set(), out = [];
  for (let p = 0; p < packs.length; p++){
    for (const name of Object.keys(packs[p])){
      if (seen.has(name)) continue;
      seen.add(name);
      const r = { n: name, p, ok: 1 };
      try {
        viz.loadPreset(packs[p][name], 0);
        let luma = 0, sat = 0, motion = 0, samples = 0, motionSamples = 0;
        const hue = new Float64Array(12);
        let prev = null;
        for (let f = 0; f < FRAMES; f++){
          viz.render({ audioLevels: frame(f / FPS), elapsedTime: 1 / FPS });
          if (f < WARM || f % STEP) continue;
          gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, px);
          const cur = new Float32Array(W * H / 4);
          let k = 0;
          for (let y = 0; y < H; y += 2) for (let x = 0; x < W; x += 2){
            const i = (y * W + x) * 4, R = px[i] / 255, G = px[i + 1] / 255, B = px[i + 2] / 255;
            const L = 0.2126 * R + 0.7152 * G + 0.0722 * B;
            const mx = Math.max(R, G, B), mn = Math.min(R, G, B), S = mx ? (mx - mn) / mx : 0;
            luma += L; sat += S * mx; samples++;
            if (mx - mn > 0.04){
              let h = mx === R ? (G - B) / (mx - mn) : mx === G ? 2 + (B - R) / (mx - mn) : 4 + (R - G) / (mx - mn);
              h = ((h * 60) + 360) % 360;
              hue[Math.floor(h / 30) % 12] += S * mx;
            }
            cur[k] = L;
            if (prev) motion += Math.abs(L - prev[k]);
            k++;
          }
          if (prev) motionSamples += k;
          prev = cur;
        }
        r.b = +(luma / samples).toFixed(3);
        r.s = +(sat / samples).toFixed(3);
        r.m = +(motionSamples ? motion / motionSamples : 0).toFixed(4);
        r.hue = Array.from(hue, v => +(v / samples).toFixed(4));
      } catch (e){
        r.ok = 0; r.err = String(e && e.message || e).slice(0, 120);
      }
      out.push(r);
      if (out.length % 25 === 0){
        log(out.length + ' done');
        fetch('/progress', { method: 'POST', body: String(out.length) }).catch(() => {});
        await new Promise(res => setTimeout(res, 0));
      }
    }
  }
  log('posting ' + out.length);
  await fetch('/result', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(out) });
  log('done');
})().catch(e => fetch('/result', { method: 'POST', body: JSON.stringify({ error: String(e && e.stack || e) }) }));
</script>
