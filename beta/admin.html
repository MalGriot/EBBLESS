<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>EBBLESS BETA · Admin</title>
<meta name="theme-color" content="#121212">
<link rel="icon" type="image/png" sizes="32x32" href="../brand/assets/icons/favicon-32.png">
<link rel="stylesheet" href="beta.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
.stats{display:flex;flex-wrap:wrap;gap:22px 34px;margin:6px 0 26px}
.stat b{display:block;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--faint)}
.stat.big b{color:var(--accent)}
.tabs{display:flex;gap:8px;margin:0 0 18px;flex-wrap:wrap}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.filters .btn{padding:6px 12px;font-size:12.5px}
.btn.on{background:var(--text);border-color:var(--text);color:#121212}
.list{border-top:1px solid var(--border)}
.item{border-bottom:1px solid var(--border);padding:14px 2px}
.item-head{display:grid;grid-template-columns:62px minmax(0,1.4fr) minmax(0,1.6fr) minmax(0,1fr) 130px;gap:12px;align-items:center;font-size:14px}
.item-head .num{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:600}
.item-head .muted{color:var(--faint);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-head .who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-head .who small{display:block;color:var(--faint);font-size:12px}
.item select{background:var(--panel);border:1px solid var(--border-2);border-radius:var(--r-md);color:var(--text);font:inherit;font-size:13px;padding:7px 9px;width:100%}
.s-pending{color:var(--text)} .s-accepted,.s-active{color:var(--good)} .s-rejected{color:var(--bad)} .s-waitlisted,.s-inactive{color:var(--faint)}
.more{margin-top:12px;display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:13.5px}
.more dt{color:var(--faint)} .more dd{margin:0;white-space:pre-wrap;word-break:break-word}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.toggle{background:none;border:0;padding:0;text-align:left;width:100%;color:inherit}
@media (max-width:720px){
  .item-head{grid-template-columns:48px 1fr 118px;row-gap:4px}
  .item-head .hide-sm{display:none}
  .more{grid-template-columns:1fr}
  .more dt{margin-top:6px}
}
.r-head{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;font-size:13px}
.r-head .rid{font-weight:600;font-variant-numeric:tabular-nums}
.r-head .kind{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--faint)}
.r-head .kind.bug{color:var(--bad)}
.r-head .num{color:var(--accent);font-weight:600}
.r-meta{font-size:12.5px;color:var(--faint);margin:4px 0 8px}
.r-block{font-size:14px;margin:6px 0;white-space:pre-wrap;word-break:break-word}
.r-block i{font-style:normal;color:var(--faint);font-size:12px;display:block}
.r-shot img{max-width:100%;border-radius:var(--r-md);border:1px solid var(--border);margin-top:8px}
textarea.invite{width:100%;min-height:260px;background:var(--panel);border:1px solid var(--border);border-radius:var(--r-md);color:var(--text);font:inherit;font-size:14px;padding:12px;line-height:1.45;margin-top:10px}
#signin{margin:30px 0}
.empty{color:var(--faint);padding:20px 0}
</style>
</head>
<body>
<main class="wrap wide">
  <div class="top"><img src="../brand/assets/wordmark-white.png" alt="EBBLESS"><span class="tag">Beta · Admin</span></div>

  <section id="gate">
    <h1 class="display">BETA ADMIN</h1>
    <div class="rule"></div>
    <p class="lede">Sign in with the Google account set as an admin.</p>
    <div id="signin"></div>
    <p class="status" id="gateStatus"></p>
  </section>

  <section id="dash" hidden>
    <div class="stats" id="stats"></div>
    <div class="tabs">
      <button class="btn sm on" data-tab="testers" type="button">Testers</button>
      <button class="btn sm" data-tab="reports" type="button">Feedback &amp; bugs</button>
      <button class="btn sm" id="refresh" type="button">Refresh</button>
      <button class="btn sm" id="signout" type="button">Sign out</button>
    </div>

    <div id="tab-testers">
      <div class="filters" id="tFilters"></div>
      <div class="list" id="testers"></div>
    </div>
    <div id="tab-reports" hidden>
      <div class="filters" id="rFilters"></div>
      <div class="list" id="reports"></div>
    </div>
    <p class="status" id="status"></p>
  </section>
</main>

<script src="beta.js"></script>
<script>
(function(){
  const GOOGLE_CLIENT_ID = '1081676829821-i60knuf71qvmooas84jr3b22ji19ehur.apps.googleusercontent.com';
  const SS_AUTH = 'ebbless:betaAdminAuth';
  const STATUSES = ['pending', 'accepted', 'active', 'waitlisted', 'inactive', 'rejected'];
  const FEEL = { fire: '🔥 Fuck yeah', good: '🙂 Pretty good', alright: '😐 It\'s alright', off: '😕 Something\'s off', skull: '💀 What the fuck is this' };
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const pad3 = (n) => n ? '#' + String(n).padStart(3, '0') : '';
  const fmtDate = (ts) => new Date(ts).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });

  // Auth: a Google ID token (1h) kept for this tab only. On localhost,
  // ?devKey= pairs with BETA_DEV_ADMIN_KEY in worker/.dev.vars for testing.
  let auth = null;
  try { auth = JSON.parse(sessionStorage.getItem(SS_AUTH) || 'null'); } catch(e){}
  const devKey = new URLSearchParams(location.search).get('devKey');
  if (devKey && /^(localhost|127\.0\.0\.1)$/.test(location.hostname)) auth = { devKey };
  if (auth && auth.exp && auth.exp * 1000 < Date.now() + 60000) auth = null;
  function saveAuth(a){ auth = a; try { a ? sessionStorage.setItem(SS_AUTH, JSON.stringify(a)) : sessionStorage.removeItem(SS_AUTH); } catch(e){} }

  async function admin(path, body){
    try { return await Beta.api('/beta/admin/' + path, Object.assign({}, auth, body)); }
    catch(e){ if (e.status === 401 || e.status === 403){ saveAuth(null); showGate(e.message); } throw e; }
  }

  function showGate(msg){
    $('dash').hidden = true; $('gate').hidden = false;
    Beta.status($('gateStatus'), msg || '', msg ? 'err' : '');
    (function init(n){
      if (window.google && google.accounts && google.accounts.id){
        google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: (r) => {
          let exp = 0; try { exp = JSON.parse(atob(r.credential.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).exp; } catch(e){}
          saveAuth({ idToken: r.credential, exp }); load();
        }});
        $('signin').innerHTML = '';
        google.accounts.id.renderButton($('signin'), { theme: 'filled_black', size: 'large', shape: 'pill', text: 'signin_with' });
      } else if (n < 50) setTimeout(() => init(n + 1), 150);
    })(0);
  }

  let data = null, tFilter = 'all', rFilter = 'all';
  async function load(){
    Beta.status($('status'), 'Loading...');
    try {
      data = await admin('list');
      $('gate').hidden = true; $('dash').hidden = false;
      Beta.status($('status'), '');
      render();
    } catch(e){ Beta.status($('dash').hidden ? $('gateStatus') : $('status'), e.message, 'err'); }
  }

  function render(){
    const c = data.counts;
    const stats = $('stats'); stats.innerHTML = '';
    [[c.filled + ' / ' + c.cap, 'testers', true], [c.remaining, 'spots left'], [c.total, 'applicants'], [c.pending, 'pending'],
     [c.accepted, 'accepted'], [c.active, 'active'], [c.waitlisted, 'waitlisted'], [c.inactive, 'inactive'], [c.rejected, 'rejected']]
      .forEach(([v, l, big]) => { const s = el('div', 'stat' + (big ? ' big' : '')); s.append(el('b', '', String(v)), el('span', '', l)); stats.append(s); });
    renderFilters($('tFilters'), ['all'].concat(STATUSES), tFilter, (f) => { tFilter = f; render(); }, (f) => f === 'all' ? c.total : c[f]);
    renderFilters($('rFilters'), ['all', 'bug', 'feedback', 'in-app'], rFilter, (f) => { rFilter = f; render(); }, (f) => data.reports.filter(r => f === 'all' || r.kind === f).length);
    renderTesters(); renderReports();
  }
  function renderFilters(box, list, cur, onPick, count){
    box.innerHTML = '';
    list.forEach(f => {
      const b = el('button', 'btn' + (f === cur ? ' on' : ''), f + ' ' + count(f)); b.type = 'button';
      b.onclick = () => onPick(f); box.append(b);
    });
  }

  function inviteText(t){
    const base = new URL('./', location.href).href;
    const tok = encodeURIComponent(t.id + '-' + t.secret);
    return 'Peace. You\'re one of the 50 people testing EBBLESS. You\'re EBBLESS TESTER ' + pad3(t.number) + '.\n\n' +
      'Open it:\n' + base + 'tester.html?t=' + tok + '\n\n' +
      'Throw one of your playlists into it (Spotify, YouTube, Apple Music, SoundCloud) and fuck around with it.\n' +
      'Try the different visual modes, lyrics, YouTube, etc.\n\n' +
      'The point of this beta isn\'t to be nice to me. If something is confusing, broken, slow, ugly, unnecessary, or just doesn\'t make sense, tell me.\n\n' +
      'Feedback:\n' + base + 'feedback.html?t=' + tok + '\n\n' +
      'If something is seriously broken, use Report a Bug:\n' + base + 'bug.html?t=' + tok + '\n\n' +
      'Have fun with it.';
  }

  const open = new Set();
  function renderTesters(){
    const box = $('testers'); box.innerHTML = '';
    // pending first (that's the work), then by number, then signup order
    const rank = { pending: 0, accepted: 1, active: 1, inactive: 2, waitlisted: 3, rejected: 4 };
    const list = data.testers.filter(t => tFilter === 'all' || t.status === tFilter)
      .sort((a, b) => (rank[a.status] - rank[b.status]) || ((a.number || 1e9) - (b.number || 1e9)) || (a.ts - b.ts));
    if (!list.length){ box.append(el('p', 'empty', 'Nobody here yet.')); return; }
    list.forEach(t => {
      const item = el('div', 'item');
      const head = el('div', 'item-head');
      head.append(el('span', 'num', pad3(t.number) || '-'));
      const tog = el('button', 'toggle who'); tog.type = 'button';
      tog.append(el('span', '', t.name), el('small', '', t.email));
      head.append(tog);
      head.append(el('span', 'muted hide-sm', [t.deviceModel || t.device, t.os, t.browser].filter(Boolean).join(' · ')));
      head.append(el('span', 'muted hide-sm', fmtDate(t.ts)));
      const sel = el('select', 's-' + t.status);
      STATUSES.forEach(s => { const o = el('option', '', s); o.value = s; if (s === t.status) o.selected = true; sel.append(o); });
      sel.onchange = async () => {
        sel.disabled = true;
        try {
          const r = await admin('status', { id: t.id, status: sel.value });
          Object.assign(t, r.tester);
          data.counts = recount();
          if (['accepted', 'active'].includes(t.status)) open.add(t.id);
          render();
        } catch(e){ sel.value = t.status; Beta.status($('status'), e.message, 'err'); }
        sel.disabled = false;
      };
      head.append(sel);
      item.append(head);
      tog.onclick = () => { open.has(t.id) ? open.delete(t.id) : open.add(t.id); renderTesters(); };
      if (open.has(t.id)) item.append(details(t));
      box.append(item);
    });
  }
  function recount(){
    const c = { total: data.testers.length, cap: data.counts.cap };
    STATUSES.forEach(s => { c[s] = data.testers.filter(t => t.status === s).length; });
    c.filled = c.accepted + c.active + c.inactive; c.remaining = Math.max(0, c.cap - c.filled);
    return c;
  }
  function details(t){
    const wrap = el('div');
    const dl = el('dl', 'more');
    [['Social', t.social], ['Device', [t.device, t.deviceModel].filter(Boolean).join(' · ')], ['OS', t.os], ['Browser', t.browser],
     ['Technical', t.comfort], ['Listens on', t.platform], ['Listens to', t.music], ['Playlist', t.playlist],
     ['Why', t.motivation], ['Wants', t.wants], ['Contact OK', t.contactOk ? 'Yes' : 'No'], ['Signed up', new Date(t.ts).toLocaleString()],
     ['Tester ID', t.id]].forEach(([k, v]) => { if (v){ dl.append(el('dt', '', k), el('dd', '', v)); } });
    wrap.append(dl);
    if (t.secret && ['accepted', 'active', 'inactive'].includes(t.status)){
      const ta = el('textarea', 'invite'); ta.readOnly = true; ta.value = inviteText(t);
      const acts = el('div', 'row-actions');
      const copy = el('button', 'btn sm primary', 'Copy invite'); copy.type = 'button';
      copy.onclick = async () => {
        try { await navigator.clipboard.writeText(ta.value); } catch(e){ ta.select(); document.execCommand('copy'); }
        copy.textContent = 'Copied'; setTimeout(() => copy.textContent = 'Copy invite', 1400);
      };
      const mail = el('a', 'btn sm', 'Email it'); mail.href = 'mailto:' + encodeURIComponent(t.email) + '?subject=' + encodeURIComponent('You\'re in: EBBLESS beta') + '&body=' + encodeURIComponent(ta.value);
      acts.append(copy, mail);
      wrap.append(acts, ta);
    }
    return wrap;
  }

  function renderReports(){
    const box = $('reports'); box.innerHTML = '';
    const byId = Object.fromEntries(data.testers.map(t => [t.id, t]));
    const list = data.reports.filter(r => rFilter === 'all' || r.kind === rFilter);
    if (!list.length){ box.append(el('p', 'empty', 'Nothing yet.')); return; }
    list.forEach(r => {
      const t = byId[r.testerId];
      const item = el('div', 'item');
      const head = el('div', 'r-head');
      if (r.id) head.append(el('span', 'rid', r.id));
      head.append(el('span', 'kind' + (r.kind === 'bug' ? ' bug' : ''), r.kind === 'in-app' ? 'in-app · ' + (r.category || '') : r.kind));
      if (r.testerNumber) head.append(el('span', 'num', pad3(r.testerNumber)));
      head.append(el('span', '', t ? t.name : (r.name || 'anonymous')));
      const topic = r.kind === 'bug' ? r.area : r.category;
      if (topic && r.kind !== 'in-app') head.append(el('span', '', topic));
      if (r.feeling) head.append(el('span', '', FEEL[r.feeling] || r.feeling));
      if (r.sentiment) head.append(el('span', '', r.sentiment === 'up' ? '👍' : '👎'));
      head.append(el('span', 'muted', fmtDate(r.ts)));
      item.append(head);
      const meta = [r.device, r.os, r.browser].filter(Boolean).join(' · ') || (r.userAgent || '');
      item.append(el('div', 'r-meta', meta + (r.viewport ? ' · ' + r.viewport : '') + (t ? ' · ' + t.email : (r.contact ? ' · ' + r.contact : ''))));
      const blocks = r.kind === 'bug'
        ? [['What went wrong', r.wrong], ['Expected', r.expected], ['Actually happened', r.actual], ['Steps', r.steps]]
        : r.kind === 'feedback'
          ? [['What happened', r.happened], ['Expected', r.expected], ['Anything else', r.extra], ['Keep using it?', r.keepUsing]]
          : [['Message', r.message], ['Track', r.track && r.track.title ? r.track.title + ' · ' + r.track.artist : ''], ['View', r.view]];
      blocks.forEach(([k, v]) => { if (v){ const b = el('div', 'r-block'); b.append(el('i', '', k), document.createTextNode(v)); item.append(b); } });
      if (r.hasShot){
        const sb = el('div', 'r-shot');
        const btn = el('button', 'btn sm', 'View screenshot'); btn.type = 'button';
        btn.onclick = async () => {
          btn.disabled = true;
          try {
            const s = await admin('shot', { reportId: r.id });
            if (s.screenshot && /^data:image\//.test(s.screenshot)){ const img = el('img'); img.src = s.screenshot; img.alt = 'Screenshot for ' + r.id; sb.replaceChildren(img); }
            else btn.textContent = 'Screenshot missing';
          } catch(e){ btn.disabled = false; }
        };
        sb.append(btn); item.append(sb);
      }
      box.append(item);
    });
  }

  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => {
    document.querySelectorAll('[data-tab]').forEach(x => x.classList.toggle('on', x === b));
    $('tab-testers').hidden = b.dataset.tab !== 'testers';
    $('tab-reports').hidden = b.dataset.tab !== 'reports';
  });
  $('refresh').onclick = load;
  $('signout').onclick = () => { saveAuth(null); try { google.accounts.id.disableAutoSelect(); } catch(e){} showGate(); };

  auth ? load() : showGate();
})();
</script>
</body>
</html>
