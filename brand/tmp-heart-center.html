<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Center the heart</title>
<style>
  body{background:#1a0a10;color:#eee;font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    display:flex;flex-direction:column;align-items:center;gap:20px;padding:40px 20px}
  h1{font-size:18px;font-weight:600;margin:0}
  p{color:#c9a}
  .tile{width:280px;height:280px;background:#121212;border-radius:14px;position:relative;
    overflow:hidden;flex:none;box-shadow:0 0 0 1px #333;cursor:grab}
  .tile.dragging{cursor:grabbing}
  .glyph{position:absolute;left:50%;top:50%;width:62%;height:62%;
    background:#e0576a;
    -webkit-mask:url(assets/liked-heart.png) center/contain no-repeat;
    mask:url(assets/liked-heart.png) center/contain no-repeat;
    transform:translate(-50%,-50%);
    pointer-events:none}
  .crosshair{position:absolute;inset:0;pointer-events:none}
  .crosshair::before,.crosshair::after{content:'';position:absolute;background:rgba(255,255,255,.15)}
  .crosshair::before{left:50%;top:0;bottom:0;width:1px}
  .crosshair::after{top:50%;left:0;right:0;height:1px}
  .readout{background:#000;border:1px solid #333;border-radius:8px;padding:14px 18px;
    font:13px/1.6 ui-monospace,Menlo,monospace;color:#0f8;min-width:280px;text-align:center}
  button{background:#e0576a;border:none;color:#fff;font-weight:600;padding:10px 18px;
    border-radius:8px;cursor:pointer;font-size:13px}
  button.secondary{background:#333;color:#ccc}
  .row{display:flex;gap:10px}
  .hint{font-size:12px;color:#987}
</style>
</head>
<body>
<h1>Drag the heart to where it should sit</h1>
<p>The dotted lines mark the tile's true center. Drag, then copy the CSS line and send it back.</p>
<div class="tile" id="tile">
  <div class="crosshair"></div>
  <div class="glyph" id="glyph"></div>
</div>
<div class="readout" id="readout">transform: translate(-50%, -50%);</div>
<div class="row">
  <button id="copyBtn">Copy CSS line</button>
  <button class="secondary" id="resetBtn">Reset to center</button>
</div>
<p class="hint" id="copied" style="visibility:hidden">Copied.</p>

<script>
const tile = document.getElementById('tile');
const glyph = document.getElementById('glyph');
const readout = document.getElementById('readout');
let offX = 0, offY = 0; // percent, relative to glyph's own box, added to the base -50%/-50%
let dragging = false, startX, startY, startOffX, startOffY;

function apply(){
  glyph.style.transform = `translate(calc(-50% + ${offX.toFixed(1)}px), calc(-50% + ${offY.toFixed(1)}px))`;
  const glyphSize = glyph.offsetWidth; // square
  const pctX = (offX / glyphSize * 100).toFixed(1);
  const pctY = (offY / glyphSize * 100).toFixed(1);
  readout.textContent = `transform: translate(calc(-50% + ${pctX}%), calc(-50% + ${pctY}%));`;
}

tile.addEventListener('pointerdown', (e) => {
  dragging = true;
  tile.classList.add('dragging');
  startX = e.clientX; startY = e.clientY;
  startOffX = offX; startOffY = offY;
  tile.setPointerCapture(e.pointerId);
});
tile.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  offX = startOffX + (e.clientX - startX);
  offY = startOffY + (e.clientY - startY);
  apply();
});
tile.addEventListener('pointerup', () => { dragging = false; tile.classList.remove('dragging'); });

document.getElementById('resetBtn').addEventListener('click', () => { offX = 0; offY = 0; apply(); });
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(readout.textContent).then(() => {
    const c = document.getElementById('copied');
    c.style.visibility = 'visible';
    setTimeout(() => c.style.visibility = 'hidden', 1500);
  });
});
apply();
</script>
</body>
</html>
