name = "spotify-youtube-search"
main = "src/index.js"
compatibility_date = "2026-08-01"

[[kv_namespaces]]
binding = "MATCH_REPORTS"
id = "9a2addf8bdf84ac093c97d5d5638ed2e"

[[kv_namespaces]]
binding = "TASTE_POOL"
id = "4c917855c0624fb3ba4f642de5dee046"

[[kv_namespaces]]
binding = "PROFILES"
id = "7ba1ba2734224136b5e998365a37ea67"

# Beta tester system (src/beta.js) stores nothing here: the beta Google
# Sheet is the source of truth, reached through its Apps Script web app
# (tools/beta-sheet.gs). Needs the SHEET_URL and SHEET_SECRET secrets:
# `npx wrangler secret put SHEET_URL` / `npx wrangler secret put SHEET_SECRET`.
# The owner-only admin routes (src/admin.js, /admin/*) also need ADMIN_TOKEN
# (32+ chars): `npx wrangler secret put ADMIN_TOKEN`. Unset = routes answer 503.
# POST /nowplaying (ON AIR, the owner's live broadcast) accepts only a verified
# Google sign-in whose email equals the OWNER_EMAIL var/secret
# (`npx wrangler secret put OWNER_EMAIL`); unset = POST answers 503. GET is public.

# Workers AI (free tier) - /vibe-interpret's sentence -> tags/seeds
# interpreter (conversational-vibe-search). Optional at runtime: without it
# the route falls back to its keyword heuristic.
[ai]
binding = "AI"

# Background podcast captions for iPhone (src/pod-captioner.js): one
# PodCaptioner per episode (a short-lived handoff buffer, never kept) and
# one shared PodCaptionBudget keeping Workers AI use under the free tier.
[[durable_objects.bindings]]
name = "POD_CAPTIONER"
class_name = "PodCaptioner"

[[durable_objects.bindings]]
name = "POD_CAPTION_BUDGET"
class_name = "PodCaptionBudget"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PodCaptioner", "PodCaptionBudget"]

[vars]
GOOGLE_CLIENT_ID = "1081676829821-i60knuf71qvmooas84jr3b22ji19ehur.apps.googleusercontent.com"

# Separate KV namespaces so local dev / testing (`wrangler dev --env staging`,
# `wrangler deploy --env staging`) never touches production's KV quota - see
# the Cloudflare KV free-tier daily put-limit hit on 2026-09-23, traced to
# a lane testing the report-wrong-track feature against prod. Deploys to a
# separate worker ("spotify-youtube-search-staging"), so point EBBLESS's
# BACKEND at that URL while testing, not the production one.
[env.staging]
name = "spotify-youtube-search-staging"

[[env.staging.kv_namespaces]]
binding = "MATCH_REPORTS"
id = "ed63bbe0fdba47c1b1c9d898a5c90b60"

[[env.staging.kv_namespaces]]
binding = "TASTE_POOL"
id = "9caa11841d094555afedc29335fc1c64"

[[env.staging.kv_namespaces]]
binding = "PROFILES"
id = "00d30b10ad134d8ab7952fa3e5a621e9"

# Bindings aren't inherited by environments - repeat the AI binding.
[env.staging.ai]
binding = "AI"

[[env.staging.durable_objects.bindings]]
name = "POD_CAPTIONER"
class_name = "PodCaptioner"

[[env.staging.durable_objects.bindings]]
name = "POD_CAPTION_BUDGET"
class_name = "PodCaptionBudget"

[env.staging.vars]
# Keeps staging's entries out of production's cache - both workers share
# the workers.dev zone's caches.default (see CACHE_NAMESPACE in src/index.js).
CACHE_NAMESPACE = "staging"
GOOGLE_CLIENT_ID = "1081676829821-i60knuf71qvmooas84jr3b22ji19ehur.apps.googleusercontent.com"
