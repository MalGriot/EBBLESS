plugins { id 'com.android.application' }

android {
    compileSdkVersion 36
    namespace "io.github.malgriot.ebbless.webview"
    defaultConfig {
        // Same id as the old TWA (same signing key), so this installs as an update over it.
        applicationId "io.github.malgriot.ebbless"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 4
        versionName "2.2.0"
    }
    buildTypes {
        // debug builds install next to the real app instead of over it
        debug { applicationIdSuffix ".debug" }
        release { minifyEnabled false }
    }
    // the splash/library background videos ship inside the app (copied from the site folder, so one source of truth)
    sourceSets.main.assets.srcDirs += "$buildDir/generated/videoAssets"
    androidResources { noCompress 'webm' }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.register('bundleVideos', Copy) {
    from("$rootDir/../brand/assets") { include 'splash-cymatics-alpha.webm', 'library-bg-alpha.webm' }
    into "$buildDir/generated/videoAssets/brand/assets"
}
preBuild.dependsOn 'bundleVideos'
