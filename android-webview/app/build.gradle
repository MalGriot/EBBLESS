plugins { id 'com.android.application' }

android {
    compileSdkVersion 36
    namespace "io.github.malgriot.ebbless.webview"
    defaultConfig {
        // Same id as the old TWA (same signing key), so this installs as an update over it.
        applicationId "io.github.malgriot.ebbless"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 34
        versionName "2.16.0"
    }
    buildTypes {
        // debug builds install next to the real app instead of over it
        debug { applicationIdSuffix ".debug" }
        release { minifyEnabled false }
    }
    // the splash/library background videos ship inside the app (copied from the site folder, so one source of truth)
    sourceSets.main.assets.srcDirs += ["$buildDir/generated/videoAssets", "$buildDir/generated/adblockAssets"]
    androidResources { noCompress 'webm', 'mp3', 'mp4' }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.register('bundleVideos', Copy) {
    from("$rootDir/../brand/assets") { include 'splash-cymatics-alpha.webm', 'enter-sound.mp3', 'splash-cymatics-native.mp4', 'wordmark-white.png' }
    into "$buildDir/generated/videoAssets/brand/assets"
}
preBuild.dependsOn 'bundleVideos'

// the fallback ad rules + script: the same adblock/ files the site serves live (one source of truth, nothing to keep in sync)
tasks.register('bundleAdblock', Copy) {
    from("$rootDir/../adblock") { include 'rules.json', 'inject.js' }
    into "$buildDir/generated/adblockAssets/adblock"
}
preBuild.dependsOn 'bundleAdblock'

dependencies {
    // WebViewCompat.addDocumentStartJavaScript: the only way to reach the cross-origin YouTube embed frame (ad skipper)
    implementation 'androidx.webkit:webkit:1.12.1'
}
