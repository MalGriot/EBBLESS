plugins { id 'com.android.application' }

android {
    compileSdkVersion 36
    namespace "io.github.malgriot.ebbless.webview"
    defaultConfig {
        // Same id as the old TWA (same signing key), so this installs as an update over it.
        applicationId "io.github.malgriot.ebbless"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 2
        versionName "2.0.0"
    }
    buildTypes {
        // debug builds install next to the real app instead of over it
        debug { applicationIdSuffix ".debug" }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
