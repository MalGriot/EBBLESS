# Builds the Windows installer (EBBLESS-Setup-<version>.exe) and attaches it to
# the matching Mac release, so the exe follows the Mac app. Runs when a release
# is published, or by hand with a tag (e.g. v1.0.14). The Mac app is built
# locally; this only adds the exe to that release (never creates or edits it).
name: Windows build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and attach the exe to (e.g. v1.0.14)'
        required: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        working-directory: desktop
        run: npm ci

      # pwsh, not Git Bash: bash puts GNU tar first, which can't read the yt-dlp zip
      # (fetch-ytdlp.js shells out to tar); in pwsh `tar` is the Windows bsdtar.
      - name: Build installer
        working-directory: desktop
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ("v$version" -ne $env:TAG) { Write-Error "desktop/package.json is $version but the release tag is $env:TAG"; exit 1 }
          npm run dist:win
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist/EBBLESS-Setup-*.exe

      - name: Attach to release
        working-directory: desktop
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/EBBLESS-Setup-*.exe --clobber
