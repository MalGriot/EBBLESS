name: Refresh radio snapshot

# Keeps data/radio/ (the world's stations and ready-made artist lists for Browse by
# region) fresh so the app does not ask Radio Browser or iTunes on every open.
# Stations daily, artist lists weekly. A failed run changes nothing; the app falls
# back to live searches for anything missing or older than 45 days.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
    - cron: '41 5 * * 0'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Stations (daily)
        if: github.event.schedule != '41 5 * * 0'
        run: node scripts/refresh-radio.js --stations
      - name: Artist lists (weekly or by hand)
        if: github.event.schedule == '41 5 * * 0' || github.event_name == 'workflow_dispatch'
        run: node scripts/refresh-radio.js --artists
      - name: Commit changes
        run: |
          git config user.name "ebbless-radio-refresh"
          git config user.email "actions@users.noreply.github.com"
          git add data/radio
          git diff --cached --quiet && exit 0
          git commit -m "Refresh the radio snapshot: stations and artist lists"
          git push
