# Builds the Play Store app (#562): a Trusted Web Activity wrapping
# https://malgriot.github.io/EBBLESS/. The Android project in android/ was
# generated by Bubblewrap; this signs it with the upload key held in repo
# secrets (ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD) and attaches the
# .aab (for Play Console) and .apk (for sideloading) as a run artifact. The
# signed .apk is also published to the `android` release (never marked latest,
# so releases/latest stays the Mac app) at a fixed URL the beta page links to:
# https://github.com/MalGriot/EBBLESS/releases/download/android/ebbless.apk
name: Android build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build unsigned bundle and APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease

      - name: Sign
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::warning::ANDROID_KEYSTORE_B64 secret is not set, skipping signing"; exit 0; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.p12"
          VERSION=$(grep -o '"appVersionName": *"[^"]*"' twa-manifest.json | cut -d'"' -f4)
          mkdir -p out
          jarsigner -keystore "$RUNNER_TEMP/upload.p12" -storetype PKCS12 \
            -storepass:env KEYSTORE_PASSWORD -sigalg SHA256withRSA -digestalg SHA-256 \
            -signedjar "out/ebbless-$VERSION.aab" app/build/outputs/bundle/release/app-release.aab upload
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/upload.p12" --ks-type PKCS12 --ks-key-alias upload \
            --ks-pass env:KEYSTORE_PASSWORD --out "out/ebbless-$VERSION.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "out/ebbless-$VERSION.apk" | grep -i sha-256
          rm -f "$RUNNER_TEMP/upload.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: ebbless-android
          path: android/out/
          if-no-files-found: warn

      - name: Publish sideload APK
        working-directory: android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls out/*.apk 2>/dev/null | head -1)
          if [ -z "$APK" ]; then echo "::warning::No signed APK, skipping release"; exit 0; fi
          cp "$APK" out/ebbless.apk
          VERSION=$(grep -o '"appVersionName": *"[^"]*"' twa-manifest.json | cut -d'"' -f4)
          if ! gh release view android >/dev/null 2>&1; then
            gh release create android --latest=false --target "$GITHUB_SHA" \
              --title "EBBLESS for Android (sideload)" \
              --notes "Install ebbless.apk on an Android phone. Allow installs from your browser when asked."
          fi
          gh release upload android out/ebbless.apk --clobber
          gh release edit android --title "EBBLESS for Android $VERSION (sideload)"
