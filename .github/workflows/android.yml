# Builds the Play Store app (#562): a Trusted Web Activity wrapping
# https://malgriot.github.io/EBBLESS/. The Android project in android/ was
# generated by Bubblewrap; this signs it with the upload key held in repo
# secrets (ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD) and attaches the
# .aab (for Play Console) and .apk (for sideloading) as a run artifact.
name: Android build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build unsigned bundle and APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease

      - name: Sign
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::warning::ANDROID_KEYSTORE_B64 secret is not set, skipping signing"; exit 0; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.p12"
          VERSION=$(grep -o '"appVersionName": *"[^"]*"' twa-manifest.json | cut -d'"' -f4)
          mkdir -p out
          jarsigner -keystore "$RUNNER_TEMP/upload.p12" -storetype PKCS12 \
            -storepass:env KEYSTORE_PASSWORD -sigalg SHA256withRSA -digestalg SHA-256 \
            -signedjar "out/ebbless-$VERSION.aab" app/build/outputs/bundle/release/app-release.aab upload
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/upload.p12" --ks-type PKCS12 --ks-key-alias upload \
            --ks-pass env:KEYSTORE_PASSWORD --out "out/ebbless-$VERSION.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "out/ebbless-$VERSION.apk" | grep -i sha-256
          rm -f "$RUNNER_TEMP/upload.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: ebbless-android
          path: android/out/
          if-no-files-found: warn
