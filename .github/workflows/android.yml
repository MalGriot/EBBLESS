# Builds the sideload app: android-webview/, a WebView shell around
# https://malgriot.github.io/EBBLESS/ so recents shows EBBLESS and not the
# browser (the old Trusted Web Activity in android/ can't do that). Same
# package id and upload key as the TWA, so it installs as an update over it.
# Signs with the key held in repo secrets (ANDROID_KEYSTORE_B64,
# ANDROID_KEYSTORE_PASSWORD) and attaches the .apk as a run artifact. The
# signed .apk is also published to the `android` release (never marked latest,
# so releases/latest stays the Mac app) at a fixed URL the beta page links to:
# https://github.com/MalGriot/EBBLESS/releases/download/android/ebbless.apk
name: Android build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android-webview/**', 'brand/assets/*-alpha.webm', 'brand/assets/enter-sound.mp3', '.github/workflows/android.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build unsigned APK
        working-directory: android-webview
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Sign
        working-directory: android-webview
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::warning::ANDROID_KEYSTORE_B64 secret is not set, skipping signing"; exit 0; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.p12"
          VERSION=$(grep -o 'versionName "[^"]*"' app/build.gradle | cut -d'"' -f2)
          mkdir -p out
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/upload.p12" --ks-type PKCS12 --ks-key-alias upload \
            --ks-pass env:KEYSTORE_PASSWORD --out "out/ebbless-$VERSION.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "out/ebbless-$VERSION.apk" | grep -i sha-256
          rm -f "$RUNNER_TEMP/upload.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: ebbless-android
          path: android-webview/out/
          if-no-files-found: warn

      - name: Publish sideload APK
        working-directory: android-webview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls out/*.apk 2>/dev/null | head -1)
          if [ -z "$APK" ]; then echo "::warning::No signed APK, skipping release"; exit 0; fi
          cp "$APK" out/ebbless.apk
          VERSION=$(grep -o 'versionName "[^"]*"' app/build.gradle | cut -d'"' -f2)
          if ! gh release view android >/dev/null 2>&1; then
            gh release create android --latest=false --target "$GITHUB_SHA" \
              --title "EBBLESS for Android (sideload)" \
              --notes "Install ebbless.apk on an Android phone. Allow installs from your browser when asked."
          fi
          gh release upload android out/ebbless.apk --clobber
          gh release edit android --title "EBBLESS for Android $VERSION (sideload)"
